with(document){ESM.iDT[0]=new ISMG6E40A32200043461FEGD01();}//--></script></head><body><h2>Motoröl-Druckschalter prüfen</h2><p><table cols="2" width="100%"><tr><td id="i010" width="1%" valign="top" nowrap>1.</td><td valign="top" width="99%">Den Stecker (A) vom Motoröldruckschalter (B) abziehen.<br><p class="FIG">&nbsp;<div class="FIG"><script>FIL(1,gESM.iDT[0],gESM.iDT[0].Width);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i020" width="1%" valign="top" nowrap>2.</td><td valign="top" width="99%">Auf Durchgang zwischen der Plusklemme (C) und dem Motor (Masse) prüfen. Bei abgestelltem Motor muss Durchgang vorhanden sein. Bei laufendem Motor darf kein Durchgang vorhanden sein.<br></td></tr></table></p></body></html>
