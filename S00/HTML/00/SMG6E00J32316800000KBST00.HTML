with(document){ESM.iDT[0]=new ISMG6E00J32316800000KBSD01();}//--></script></head><body><h2>Sustitución de la luz de la zona de carga</h2><p><table cols="2" width="100%"><tr><td id="i010" width="1%" valign="top" nowrap>1.</td><td valign="top" width="99%">Gire el interruptor de luces a la posición OFF.<br><br></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i020" width="1%" valign="top" nowrap>2.</td><td valign="top" width="99%">Desconecte el conector 2P (A) de la luz de la zona de carga (B).<br><br><p><table width="100%" cellspacing="0" class="None"><tbody><tr><td width="38%" align="left" valign="top"><b>Luz de la zona de carga:</b>&nbsp;</td><td width="63%" align="left" valign="top"><b>5 W</b>&nbsp;</td></tr></tbody></table></p><p class="FIG">&nbsp;<div class="FIG"><script>FIL(1,gESM.iDT[0],gESM.iDT[0].Width);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i030" width="1%" valign="top" nowrap>3.</td><td valign="top" width="99%">Efectúe el montaje siguiendo en sentido inverso al orden de desmontaje.<br></td></tr></table></p></body></html>
