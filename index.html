<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="HONDA MOTOR Co.,Ltd.">
<meta name="co-author" content="Joel Faura M.">
<title>Manual de Taller (HONDA MOTOR Co.,Ltd.)</title>
<link rel="icon" type="image/x-icon" href="./HondaESM.ico">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  #header { height: 71px; overflow: hidden; background: #fff; }
  #main { display: flex; height: calc(100% - 71px - 36px); }
  #F11 { width: 370px; min-width: 370px; border: none; border-right: 1px solid #ccc; height: 100%; }
  #EsmContents { flex: 1; border: none; height: 100%; }
  footer {
    height: 36px; display: flex; align-items: center; justify-content: center;
    background: #f5f5f5; border-top: 1px solid #ddd;
    font-family: Arial, sans-serif; font-size: 11px; color: #555;
    gap: 18px; padding: 0 12px;
  }
  footer span { white-space: nowrap; }
  footer a { color: #555; text-decoration: none; }
  footer .sep { color: #bbb; }
</style>
<link href="./_COM/HONDAESM.CSS" rel="stylesheet">
<script src="./_COM/HONDAESM.JS"></script>
<script src="./_COM/MESSAGE.JS"></script>
<script src="./_COM/ESMLANG.JS"></script>
<script src="./_COM/main.js"></script>
</head>
<body>

<div id="header">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr style="margin:0;padding:0;">
      <td width="1%"></td>
      <td><div class="Header">HONDA ESM</div></td>
      <td valign="top" align="right" width="1%"><img src="./_COM/PNG/TTLHONDA.PNG" alt="Honda"></td>
      <td width="1%"></td>
    </tr>
  </table>
  <img src="./_COM/PNG/TITLEBAR.PNG" width="100%" height="31px" alt="">
</div>

<div id="main">
  <iframe id="F11" name="F11" src="./_COM/ESMBLANK.HTML"></iframe>
  <iframe id="EsmContents" name="EsmContents" src="./_COM/ESMBLANK.HTML"></iframe>
</div>

<script>
  window.F10 = { location: {} };
  Object.defineProperty(window, 'F12', {
    get: function() { return window.frames['EsmContents']; },
    configurable: true
  });
</script>

<div id="imgModal" onclick="closeImageModal()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;cursor:zoom-out;">
  <button onclick="event.stopPropagation();closeImageModal()" style="position:absolute;top:14px;right:18px;background:none;border:none;color:#fff;font-size:36px;line-height:1;cursor:pointer;padding:0;opacity:0.85;">&#x2715;</button>
  <img id="imgModalImg" src="" alt="" onclick="event.stopPropagation()" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:95vw;max-height:95vh;object-fit:contain;cursor:default;box-shadow:0 4px 32px rgba(0,0,0,0.6);">
</div>

<script>
  document.getElementById('EsmContents').addEventListener('load', function() {
    try {
      var cw = this.contentWindow;
      if (cw && typeof cw.ZoomOpen === 'function') {
        cw.ZoomOpen = function(data) {
          if (cw.document && cw.document.ESM) cw.document.ESM.COut = data;
          showImage(data);
        };
      }
    } catch(e) {}
  });

  function showImage(data) {
    var langPath = gESM.Lng[gESM.lngSel].Code + gESM.subSel;
    var img = document.getElementById('imgModalImg');
    img.src = langPath + '/PNG/' + data.Name + '.PNG';
    document.getElementById('imgModal').style.display = 'block';
  }
  function closeImageModal() {
    document.getElementById('imgModal').style.display = 'none';
    document.getElementById('imgModalImg').src = '';
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeImageModal();
  });
</script>

<noscript>
  <h2>Enable JavaScript in your browser.</h2>
</noscript>

<footer>
  <span>Manual content &copy; Honda Motor Co., Ltd. All rights reserved.</span>
  <span class="sep">|</span>
  <span>Unofficial browser modernization by <a href="https://joelfaura.com/portfolio">Joel Faura</a> &mdash; not affiliated with or endorsed by Honda.</span>
  <span class="sep">|</span>
  <span>For personal/educational use only.</span>
</footer>
</body>
</html>
