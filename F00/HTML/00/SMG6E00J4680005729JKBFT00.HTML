with(document){ESM.iDT[0]=new ISMG6E00J4680005729JKBFD01();}//--></script></head><body><h2>Remplacement de bague d'étanchéité de soubassement</h2>NOTA&nbsp;: Veiller à ne pas rayer l'encadrement de store coulissant.<br><br><p><table cols="2" width="100%"><tr><td id="i010" width="1%" valign="top" nowrap>1.</td><td valign="top" width="99%"><a href="./SMG6E00J4680005729EKBFT00.HTML">Déposer l'encadrement du store.</a><br><br></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i020" width="1%" valign="top" nowrap>2.</td><td valign="top" width="99%">Déposer les joints avant (A) et arrière (B) de l'encadrement en tirant.<br><p class="FIG">&nbsp;<div class="FIG"><script>FIL(1,gESM.iDT[0],gESM.iDT[0].Width);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i030" width="1%" valign="top" nowrap>3.</td><td valign="top" width="99%">Pour la repose, suivre l'ordre inverse de dépose<br></td></tr></table></p></body></html>
